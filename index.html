<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon" href="resources/favicon.ico" type="image/x-icon" sizes="96x96"/>
    <title>Join Our Newsletter</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <main class="contenedor">
      <section class="arriba">
        <img src="resources/logo.svg" class="logo">
        <h1>Join our newsletter</h1>
        <p>Keep up with our latest collections, exclusive deals, and special offers! We introduce a new collection every week, so stay tuned to snag the hottest items just for you.</p>
      </section>

      <section class="abajo">
        <form class="formulario">
          <input type="text" placeholder="Enter your email address">

          <button type="submit">
            Subscribe now
          </button>

          <p class="terminos">Your email is 100% confidential and won’t send you any spam.</p>
        </form>
      </section>
    </main>

    <div class="author-info">Coded by <a href="#">Victoria Martinez Gutierrez</a></div>
  </body>
</html>
